fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--fix, --config, .markdownlint.jsonc]
  # Core purity (TASK-011.08): the Zig sim core must name no presentation or
  # audio API and do no file I/O outside the asset-loading paths. Scans core/
  # itself rather than the staged files, so it runs on every commit and cannot
  # pass just because a commit touched something else.
  - repo: local
    hooks:
      - id: validate-simulation-boundary
        name: validate simulation boundary (core/ purity)
        entry: tools/validate_simulation_boundary.py
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-simulation-boundary-selftest
        name: validate simulation boundary self-check
        entry: tools/test_validate_simulation_boundary.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-executables-have-shebangs
        files: \.(py|sh)$
      - id: check-docstring-first
        files: \.(py)$
        exclude: |
            (?x)^(
                scratch.py
            )$
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        files: \.(py|sh)$
      - id: check-symlinks
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        files: \.(py|sh)$
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        files: \.(py|sh)$
      - id: requirements-txt-fixer
        files: requirements.txt
      - id: check-toml
        files: \.toml$
      - id: check-yaml
        args: [--unsafe]
        files: \.(yaml|yml)$
      - id: pretty-format-json
        # https://pre-commit.com/#regular-expressions
        args: ['--autofix', '--indent=2', '--no-sort-keys']
        files: \.(json|jsonc)$
        exclude: |
            (?x)^(
                .devcontainer/devcontainer.json|
                .vscode/launch.json|
                .vscode/settings.json|
                .vscode/extensions.json|
            )$

