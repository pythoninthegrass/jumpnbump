# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

set: ['e', 'u', 'pipefail']
shopt: ['globstar']

vars:
  MISE_SHIMS: "{{.HOME}}/.local/share/mise/shims"
  ZIG_GLOBAL_CACHE_DIR: "{{.ROOT_DIR}}/.cache/zig"

env:
  # mise-shimmed binaries must win over a stale system PATH entry.
  PATH: "{{.MISE_SHIMS}}:{{.PATH}}"
  ZIG_GLOBAL_CACHE_DIR: "{{.ZIG_GLOBAL_CACHE_DIR}}"

# Per-subsystem task files (core.yml, extension.yml, game.yml) get wired in
# here as Phase 2+ adds those builds; do not list files that don't exist yet.
includes:
  ci: taskfiles/ci.yml
  assets: taskfiles/assets.yml
  game: taskfiles/game.yml
  legacy: taskfiles/legacy.yml

tasks:
  default:
    desc: "Default task"
    cmds:
      - task --list

  check:
    desc: "The one documented build/test command: the Godot build's boundary/test gates and the asset pipeline's reproducibility gates (TASK-015.05 -- the legacy SDL build is no longer part of the default gate, see `task legacy:build`)"
    cmds:
      - task: assets:check
      - task: game:boundary-check
      - task: game:test
