# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

vars:
  LINUX_APT_PKGS: "libsdl1.2-dev libsdl-mixer1.2-dev libsdl-net1.2-dev zlib1g-dev libbz2-dev"
  # SDL 1.2 was dropped from Homebrew core (sdl12-compat replaced it) and
  # there's no current SDL_mixer/SDL_net 1.2-compatible formula, so those two
  # are built from source against sdl12-compat's sdl-config.
  MACOS_SDL_MIXER_VERSION: "1.2.12"
  MACOS_SDL_NET_VERSION: "1.2.8"
  MACOS_SDL_BUILD_DIR: "{{.ROOT_DIR}}/.cache/sdl12-build"

tasks:
  _install-linux-deps:
    internal: true
    desc: "Install the SDL 1.2 dev packages the legacy make build needs (apt)"
    platforms: [linux]
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y {{.LINUX_APT_PKGS}}
    status:
      - for pkg in {{.LINUX_APT_PKGS}}; do dpkg -s "$pkg" >/dev/null 2>&1 || exit 1; done

  linux-check:
    desc: "Linux CI entrypoint: install deps, verify the legacy oracle still builds, then run the documented build/test gate"
    deps: ["_install-linux-deps"]
    cmds:
      - task: :legacy:build
      - task: :check

  _install-macos-deps:
    internal: true
    desc: "Build the SDL 1.2 toolchain (sdl12-compat + SDL_mixer/SDL_net 1.2 from source) the legacy make build needs"
    platforms: [darwin]
    cmds:
      - brew install sdl12-compat libmikmod
      - mkdir -p {{.MACOS_SDL_BUILD_DIR}}
      - |
        set -e
        cd {{.MACOS_SDL_BUILD_DIR}}
        curl -fsSL -o SDL_mixer-{{.MACOS_SDL_MIXER_VERSION}}.tar.gz \
          https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-{{.MACOS_SDL_MIXER_VERSION}}.tar.gz
        rm -rf SDL_mixer-{{.MACOS_SDL_MIXER_VERSION}}
        tar xzf SDL_mixer-{{.MACOS_SDL_MIXER_VERSION}}.tar.gz
        cd SDL_mixer-{{.MACOS_SDL_MIXER_VERSION}}
        CFLAGS="-I$(brew --prefix libmikmod)/include" LDFLAGS="-L$(brew --prefix libmikmod)/lib" \
          ./configure --prefix="$(brew --prefix)"
        make -j"$(sysctl -n hw.ncpu)"
        make install
      - |
        set -e
        cd {{.MACOS_SDL_BUILD_DIR}}
        curl -fsSL -o SDL_net-{{.MACOS_SDL_NET_VERSION}}.tar.gz \
          https://www.libsdl.org/projects/SDL_net/release/SDL_net-{{.MACOS_SDL_NET_VERSION}}.tar.gz
        rm -rf SDL_net-{{.MACOS_SDL_NET_VERSION}}
        tar xzf SDL_net-{{.MACOS_SDL_NET_VERSION}}.tar.gz
        cd SDL_net-{{.MACOS_SDL_NET_VERSION}}
        ./configure --prefix="$(brew --prefix)"
        make -j"$(sysctl -n hw.ncpu)"
        make install
    status:
      - command -v sdl-config >/dev/null 2>&1
      - test -e "$(brew --prefix)/lib/libSDL_mixer.dylib"
      - test -e "$(brew --prefix)/lib/libSDL_net.dylib"

  macos-check:
    desc: "macOS CI entrypoint: install deps, verify the legacy oracle still builds, then run the documented build/test gate"
    deps: ["_install-macos-deps"]
    cmds:
      - task: :legacy:build
      - task: :check
