# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

# TASK-012.04/.05: builds the godot-cpp GDExtension shim (see docs/build-layout.md).

tasks:
  build:
    desc: "Build the GDExtension shim for the current platform (template_debug), pulling in :submodules and core:build-abi first"
    summary: |
      Builds game/bin/libjumpnbump.<platform>.template_debug[.<arch>]
      via `scons target=template_debug platform=...`, using Task's own
      `platforms:` key on each cmd (not a shell case statement) to pick
      linux/macos for the current OS -- the other is silently skipped.
      macOS pins arch=arm64 explicitly: a bare `scons platform=macos`
      defaults to arch=universal, which fails to link against the
      Zig-built libjumpnbump.a (single-arch, matching the host it was
      built on) -- see TASK-012.05's own notes. Pulls in :submodules
      and core:build-abi first. Windows/web are out of scope (no
      [libraries] entry for either in game/bin/jumpnbump.gdextension).

      Example:
        task extension:build
    deps: [":submodules", ":core:build-abi"]
    dir: extension
    cmds:
      - cmd: scons target=template_debug platform=linux
        platforms: [linux]
      - cmd: scons target=template_debug platform=macos arch=arm64
        platforms: [darwin]

  build-macos:
    desc: "Build the macOS arm64 GDExtension framework bundle for both template_debug and template_release (TASK-009)"
    summary: |
      macOS-only counterpart to extension:build that also builds the
      template_release framework -- extension:build only ever produces
      template_debug, which is fine for `task run` but leaves
      game/bin/jumpnbump.gdextension's macos.release key unsatisfied,
      so a Godot export (which links the release template) has nothing
      to embed. Runs scons twice (target=template_debug, then
      target=template_release) so both
      game/bin/libjumpnbump.macos.template_debug.framework/ and
      .../template_release.framework/ exist afterward, matching
      ~/git/neo_snake's extension:build-macos.

      Example:
        task extension:build-macos
    platforms: [darwin/arm64]
    deps: [":submodules", ":core:build-abi"]
    dir: extension
    cmds:
      - scons platform=macos arch=arm64 target=template_debug
      - scons platform=macos arch=arm64 target=template_release
