# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

# TASK-012.04/.05: builds the godot-cpp GDExtension shim (see docs/build-layout.md).

tasks:
  build:
    desc: "Build the GDExtension shim for the current platform (template_debug), pulling in :submodules and core:build-abi first"
    summary: |
      Builds game/bin/libjumpnbump.<platform>.template_debug[.<arch>]
      via `scons target=template_debug platform=...`, using Task's own
      `platforms:` key on each cmd (not a shell case statement) to pick
      linux/macos for the current OS -- the other is silently skipped.
      macOS pins arch=arm64 explicitly: a bare `scons platform=macos`
      defaults to arch=universal, which fails to link against the
      Zig-built libjumpnbump.a (single-arch, matching the host it was
      built on) -- see TASK-012.05's own notes. Pulls in :submodules
      and core:build-abi first. Windows/web are out of scope (no
      [libraries] entry for either in game/bin/jumpnbump.gdextension).

      Example:
        task extension:build
    deps: [":submodules", ":core:build-abi"]
    dir: extension
    cmds:
      - cmd: scons target=template_debug platform=linux
        platforms: [linux]
      - cmd: scons target=template_debug platform=macos arch=arm64
        platforms: [darwin]
