# Single source of truth for what mise cannot express in the game toolchain.
# Parsed by tools/render_music.py. Environment variables of the same name
# override any entry.

# openmpt123 (TASK-013.03): renders bump.mod/jump.mod/scores.mod to WAV,
# which tools/render_music.py then encodes to OGG. Unlike Furnace
# (tools/render_music.py in ~/git/neo_snake), upstream libopenmpt does not
# publish a portable static Linux binary at https://lib.openmpt.org/files/
# libopenmpt/bin/ -- only Windows/DOS archives -- so there is no
# checksum-verified download to pin here. openmpt123 is expected to already
# be on PATH (e.g. `dnf install openmpt123` / `apt install openmpt123` from
# the distro's package, EPEL on RHEL-likes); this pin is a version check
# against `openmpt123 --short-version`, not a fetch target.
OPENMPT123_VERSION="0.8.7"

# gdUnit4 (TASK-014.07): the GDScript test framework used for the Tier-D
# corpus-replay suite, extracted to game/addons/gdUnit4 by
# tools/bootstrap.py -- not committed to git, same convention as
# ~/git/neo_snake's own pin (identical upstream release, so the same
# version/URL/SHA256).
GDUNIT4_VERSION="6.2.1"
GDUNIT4_URL="https://github.com/godot-gdunit-labs/gdUnit4/archive/refs/tags/v6.2.1.zip"
GDUNIT4_SHA256="ffb48847c46f386bf0c7a716fd68c6dace7d67730775cf7f748adce8ef3ed794"
